spring.application.name=Event-Booking-Platform


spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/event_booking_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

#spring.datasource.url=jdbc:mysql://localhost:3307/event_booking_db
#spring.datasource.username=root
#spring.datasource.password=@1AbC@1AbC
#server.port=8081

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.batch.job.enabled=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%X{requestId}] [%X{user}] %-5level %logger{36} - %msg%n

#---Kafka-----

spring.kafka.bootstrap-servers=kafka:9092

#---Producer--
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer


#---Consumer---
spring.kafka.consumer.group-id=notification-group-v7
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

#Trust all packages for JSON deserialization
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer



